[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wimon"
version = "0.1.0"
description = "Host toolkit and firmware companion for an ESP32 Wi-Fi monitor cluster"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "The wimon contributors" }]
keywords = ["esp32", "wifi", "802.11", "pcap", "packet-capture", "monitor-mode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["scapy>=2.7,<3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
wimon = "wimon.__main__:main"

[project.urls]
Homepage = "https://github.com/OWNER/wimon"
Issues = "https://github.com/OWNER/wimon/issues"
Security = "https://github.com/OWNER/wimon/security/advisories"

[tool.hatch.build.targets.wheel]
packages = ["wimon"]
exclude = ["wimon/tests", "wimon/__pycache__", "**/*.pyc"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["build", "build-*", "captures", "managed_components"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# pcap_dump.py exec()s the decoder core, which defines SHOW_PRIVATE, main and
# other names; static analysis cannot see them.
"wimon/pcap_dump.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["wimon"]
testpaths = ["wimon/tests"]
