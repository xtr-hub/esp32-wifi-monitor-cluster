name: Bug report
description: Report a reproducible defect in the firmware or host toolkit.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include real captures, credentials,
        addresses or other personal data. Use placeholders.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `wimon --version` or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware (ESP32)
        - Collector / capture
        - Decoder / frames
        - Events / SQLite
        - Node control / OTA
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact command and the complete error output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use placeholder paths and addresses where possible.
      placeholder: |
        1. Run `wimon ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, ESP-IDF version, board/target.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real credentials, captures and personal data from this report.
          required: true
